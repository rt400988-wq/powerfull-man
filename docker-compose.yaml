services:
  orchestrator:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${DB_ADMIN_USER:-agency}:${DB_ADMIN_PASS:-agency}@postgres:5432/${DB_NAME:-agency}
      REDIS_URL: redis://redis:6379/0
      OUTREACH_MODE: ${OUTREACH_MODE:-inbox_only}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-agency}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASS:-agency}
      POSTGRES_DB: ${DB_NAME:-agency}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-agency} -d ${DB_NAME:-agency}"], interval: 5s, timeout: 5s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    depends_on: [prometheus]
volumes:
  pgdata:
  miniodata:
