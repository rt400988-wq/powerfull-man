[general]
; Template only. Do not enable outbound dialing without consent, disclosure, and human review.
register => {{SIP_USERNAME}}:{{SIP_PASSWORD}}@{{SIP_TRUNK_HOST}}

[agency-agent]
type=friend
host=dynamic
context=agency-internal
disallow=all
allow=opus
allow=ulaw

[provider]
type=peer
host={{SIP_TRUNK_HOST}}
username={{SIP_USERNAME}}
secret={{SIP_PASSWORD}}
fromuser={{SIP_FROM_NUMBER}}
context=from-provider
